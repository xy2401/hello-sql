name: collect-docker-outputs

on:
  workflow_dispatch:

concurrency:
  group: docker-evidence-main
  cancel-in-progress: false

jobs:
  collect-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Collect pinned Docker/CLI evidence
        run: npm run collect:docker
      - name: Verify catalog and docs
        run: npm run check

      - name: Commit collected evidence to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .env.versions ':(glob)demos/**/docker/*.out.txt'
          if git diff --cached --quiet; then
            echo "Docker evidence is unchanged."
            exit 0
          fi
          git commit -m "chore: update Docker evidence (run $GITHUB_RUN_ID)"
          git push origin HEAD:main

      - name: Upload evidence snapshot backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hello-sql-docker-evidence-${{ github.run_id }}
          path: |
            .env.versions
            demos/**/docker/*.out.txt
          include-hidden-files: true
          if-no-files-found: error
